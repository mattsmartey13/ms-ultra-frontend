services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ms_ultra_frontend_dev
    ports:
      - "3000:3000"
    volumes:
      - .:/app:cached             # map host folder into container
      - /app/node_modules         # keep container's node_modules separate
    environment:
      - CHOKIDAR_USEPOLLING=true
      - REACT_APP_BACKEND_URL=http://localhost:8000
    command: npm start
    networks:
      - ms_ultra_network

networks:
  ms_ultra_network:
    external: true
